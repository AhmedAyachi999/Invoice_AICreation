<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Invoice Assistant</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <header id="title">AI Invoice Assistant</header>

  <main>
    <section id="chat">
      <div id="messages"></div>
      <form id="chat-form">
        <input id="chat-input" autocomplete="off" placeholder="Type a message about customers, products or invoices">
        <button type="submit">Send</button>
      </form>
    </section>

    <section id="list">
      <nav id="tabs">
        <button data-entity="customers" class="active">Customers</button>
        <button data-entity="products">Products</button>
        <button data-entity="invoices">Invoices</button>
      </nav>
      <h2 id="list-title">Customers</h2>
      <table id="list-table"></table>
    </section>
  </main>

  <script src="app.js?v=11"></script>
</body>
</html>
